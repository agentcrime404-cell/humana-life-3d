# HUMANA life 3D su Render (render.com) — versione DEMO gratuita.
# Piano free: si spegne dopo circa 15 minuti senza visite (al primo accesso ci mette circa un minuto a riaccendersi)
# e NON ha disco: account, monete e progressi si cancellano a ogni riavvio. Per tenerlo davvero online:
# plan: starter + il blocco "disk" sotto + DATABASE_PATH_3D=/var/data/humana-3d.sqlite
services:
  - type: web
    name: humana-life-3d
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/play-3d.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Pagamenti: nessuna chiave Stripe e nessun TEST_PAYMENTS = ricariche spente (nessun soldo vero).
    # disk:
    #   name: humana-dati
    #   mountPath: /var/data
    #   sizeGB: 1
