<!doctype html><meta charset="utf-8"><title>Africa Twin FBX → GLB</title>
<style>body{margin:0;background:#bcd9ee;font:13px system-ui}#i{position:fixed;left:8px;top:8px;background:#000a;color:#fff;padding:6px 10px;border-radius:8px;white-space:pre}</style><div id="i">carico…</div>
<script type="importmap">{"imports":{"three":"/three/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';import {FBXLoader} from '/jsm/loaders/FBXLoader.js';import {GLTFExporter} from '/jsm/exporters/GLTFExporter.js';
const I=document.getElementById('i'),log=t=>I.textContent=t;const q=new URLSearchParams(location.search);
const L=new FBXLoader();L.setResourcePath('/src/africa/');
L.load('/src/africa/africa.fbx',async obj=>{
 await new Promise(r=>setTimeout(r,1500));const cvT=new Map(),tex=m=>{if(!m.map||!m.map.image)return null;if(cvT.has(m.map))return cvT.get(m.map);const im=m.map.image,c=document.createElement('canvas');c.width=im.width||256;c.height=im.height||256;c.getContext('2d').drawImage(im,0,0);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.flipY=m.map.flipY;cvT.set(m.map,t);return t;};const mm=new Map();obj.traverse(o=>{if(o.isMesh){o.material=[].concat(o.material).map(m=>{if(!mm.has(m))mm.set(m,new THREE.MeshStandardMaterial({name:m.name,map:tex(m),roughness:.55,metalness:.25}));return mm.get(m);});if(o.material.length===1)o.material=o.material[0];}});obj.updateMatrixWorld(true);let tris=0,meshes=0;const mats=new Set();obj.traverse(o=>{if(o.isMesh){meshes++;tris+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;[].concat(o.material).forEach(m=>mats.add(m));}});
 let b=new THREE.Box3().setFromObject(obj),s=b.getSize(new THREE.Vector3());
 // normalizza: lunghezza massima = 2.3 m, appoggiato a terra, centrato; lunghezza lungo z
 const wrap=new THREE.Group();wrap.add(obj);if(s.x>s.z)wrap.rotation.y=Math.PI/2*(+q.get('s')||1);wrap.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(wrap);s=b.getSize(new THREE.Vector3());
 const k=2.3/Math.max(s.z,.001);wrap.scale.setScalar(k);wrap.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(wrap);const c=b.getCenter(new THREE.Vector3());wrap.position.set(-c.x,-b.min.y,-c.z);wrap.rotation.y+=+(q.get('yaw')||0);
 const root=new THREE.Group();root.add(wrap);root.updateMatrixWorld(true);
 const sc=new THREE.Scene();sc.background=new THREE.Color('#bcd9ee');sc.add(new THREE.HemisphereLight('#fff','#889',1.3));const d=new THREE.DirectionalLight('#fff',2);d.position.set(4,8,5);sc.add(d);sc.add(root);
 const g=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshLambertMaterial({color:'#8d8f93'}));g.rotation.x=-Math.PI/2;sc.add(g);
 const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);
 const cam=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100),a=+(q.get('a')||.7);cam.position.set(Math.sin(a)*5.5,1.8,Math.cos(a)*5.5);cam.lookAt(0,.7,0);r.render(sc,cam);
 window.__obj=obj;window.__mats=[...mats];const info=`meshes ${meshes}  triangoli ${Math.round(tris)}  materiali ${mats.size}  dim ${s.x.toFixed(2)}x${s.y.toFixed(2)}x${s.z.toFixed(2)}`;log(info);
 if(q.get('save')){log(info+'\nesporto…');new GLTFExporter().parse(root,async res=>{const r2=await fetch('/save?to='+encodeURIComponent('client/assets/world/napoli/vehicles/moto-vere/africa.glb'),{method:'POST',body:res});log(info+'\nsalvato '+JSON.stringify(await r2.json()));},e=>log('errore '+e),{binary:true,onlyVisible:true,maxTextureSize:1024});}
},undefined,e=>log('errore FBX '+e));
</script>
